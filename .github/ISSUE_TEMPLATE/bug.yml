name: Reportar defecto
description: Informar un comportamiento incorrecto
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado observado y versión
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Perfil afectado
      options:
        - Administrador
        - Supervisor
        - Operario
        - Login / sitio público
        - API / base de datos
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia no sensible