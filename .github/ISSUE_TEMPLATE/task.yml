name: Tarea técnica
description: Registrar mantenimiento, deuda técnica o infraestructura
title: "chore: "
labels: ["technical"]
body:
  - type: textarea
    id: reason
    attributes:
      label: Motivo
      description: ¿Qué riesgo, deuda o necesidad técnica atiende?
    validations:
      required: true
  - type: textarea
    id: scope
