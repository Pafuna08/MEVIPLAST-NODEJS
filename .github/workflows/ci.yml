name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, "feature/**", "fix/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Lint backend
        run: npm run lint --prefix backend
      - name: Lint frontend
        run: npm run lint --prefix frontend
      - name: Audit backend dependencies for critical advisories
        run: npm audit --prefix backend --audit-level=critical
      - name: Run backend tests
        run: npm test --prefix backend
      - name: Audit frontend dependencies for critical advisories
        run: npm audit --prefix frontend --audit-level=critical
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Build React frontend
        run: npm run build --prefix frontend
