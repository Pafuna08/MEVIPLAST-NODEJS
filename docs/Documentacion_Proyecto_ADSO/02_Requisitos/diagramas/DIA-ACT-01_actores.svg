<text x="90" y="180" font-size="15" font-weight="700" fill="#1F3864" text-anchor="start">Visitante sin sesión</text>
<text x="90" y="206" font-size="13" font-weight="400" fill="#5F6B7A" text-anchor="start">Ve el sitio público y llega al inicio de</text>
<text x="90" y="226" font-size="13" font-weight="400" fill="#5F6B7A" text-anchor="start">sesión y a la recuperación de cuenta.</text>
<text x="90" y="254" font-size="13" font-weight="400" fill="#5F6B7A" text-anchor="start">No es un rol: no tiene permisos en la API.</text>
<text x="44" y="790" font-size="13" font-weight="400" fill="#5F6B7A" text-anchor="start">La flecha con triángulo es una generalización: cada rol hereda lo del usuario autenticado (cerrar sesión y Mi perfil). Los permisos propios de cada rol se validan en el servidor.</text>
