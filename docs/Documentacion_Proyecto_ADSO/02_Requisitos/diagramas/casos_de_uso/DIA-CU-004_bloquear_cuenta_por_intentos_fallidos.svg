<text x="92" y="681" font-size="14" font-weight="400" fill="#1B2A41" text-anchor="start">API: POST /api/auth/login → 423 mientras dure el bloqueo   ·   PUT /api/usuarios/{id}/desbloquear (CU-002)</text>
<text x="92" y="704" font-size="14" font-weight="400" fill="#1B2A41" text-anchor="start">Resultado: 5 fallos seguidos bloquean la cuenta 15 minutos (configurable); el administrador puede desbloquearla antes (CU-002).</text>
