<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrador | MEVIPLAST</title>
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body data-role="Administrador">
    <div class="dashboard">
      <aside class="sidebar">
        <a class="sidebar-brand" href="dashboard-admin.html"
          ><img src="assets/logo-meviplast.png" alt="" /><span
            >MEVIPLAST</span
          ></a
        >
        <p class="role-label">Administrador</p>
        <nav class="side-nav">
          <a class="active" href="#inicio" data-view="inicio"
            ><span class="nav-icon">IN</span>Inicio</a
          ><a href="#usuarios" data-view="usuarios"
            ><span class="nav-icon">US</span>Usuarios</a
          ><a href="#materia" data-view="materia"
            ><span class="nav-icon">MP</span>Materias primas</a
          ><a href="#inventario" data-view="inventario"
            ><span class="nav-icon">IT</span>Inventario</a
          ><a href="#produccion" data-view="produccion"
            ><span class="nav-icon">PR</span>Producción</a
          ><a href="#ventas" data-view="ventas"
            ><span class="nav-icon">VT</span>Ventas</a
          ><a href="#reportes" data-view="reportes"
            ><span class="nav-icon">RP</span>Reportes</a
          >
        </nav>
        <div class="sidebar-footer">
          <button id="logout" type="button">Cerrar sesión</button>
        </div>
      </aside>
      <section class="workspace">
        <header class="topbar">
          <div class="topbar-left">
            <button class="sidebar-toggle" type="button">☰</button>
            <div>
              <h1>Panel administrativo</h1>
              <p data-today></p>
            </div>
          </div>
          <div class="user-menu">
            <span class="user-avatar">AD</span>
            <div>
              <strong data-user-name></strong><span data-role-name></span>
            </div>
          </div>
        </header>
        <main class="main-content" id="app"></main>
      </section>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script src="js/dashboard.js"></script>
  </body>
</html>
