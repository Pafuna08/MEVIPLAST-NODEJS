<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supervisor | MEVIPLAST</title>
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body data-role="Supervisor">
    <div class="dashboard">
      <aside class="sidebar">
        <a class="sidebar-brand" href="dashboard-supervisor.html"
          ><img src="assets/logo-meviplast.png" alt="" /><span
            >MEVIPLAST</span
          ></a
        >
        <p class="role-label">Supervisor</p>
        <nav class="side-nav">
          <a class="active" href="#inicio" data-view="inicio"
            ><span class="nav-icon">IN</span>Inicio</a
          ><a href="#asignar" data-view="asignar"
            ><span class="nav-icon">AT</span>Asignar tareas</a
          ><a href="#operarios" data-view="operarios"
            ><span class="nav-icon">OP</span>Operarios</a
          ><a href="#produccion" data-view="produccion"
            ><span class="nav-icon">SP</span>Seguimiento</a
          ><a href="#reportes" data-view="reportes"
            ><span class="nav-icon">RP</span>Reportes</a
          >
        </nav>
        <div class="sidebar-footer">
          <button id="logout" type="button">Cerrar sesión</button>
        </div>
      </aside>
      <section class="workspace">
        <header class="topbar">
          <div class="topbar-left">
            <button class="sidebar-toggle" type="button">☰</button>
            <div>
              <h1>Control de producción</h1>
              <p data-today></p>
            </div>
          </div>
          <div class="user-menu">
            <span class="user-avatar">SU</span>
            <div>
              <strong data-user-name></strong><span data-role-name></span>
            </div>
          </div>
        </header>
        <main class="main-content" id="app"></main>
      </section>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script src="js/dashboard.js"></script>
  </body>
</html>
