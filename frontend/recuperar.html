<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Recuperación de cuenta MEVIPLAST.">
  <title>Recuperar cuenta | MEVIPLAST</title>
  <link rel="icon" href="assets/logo-meviplast.png">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="recovery-shell">
    <a class="recovery-back" href="login.html">← Volver al inicio de sesión</a>
    <section class="login-card recovery-card">
      <div class="login-heading">
        <span>Seguridad de la cuenta</span>
        <h1 id="recovery-title">Recuperar cuenta</h1>
        <p id="recovery-description">Ingresa el correo registrado y elige si quieres recuperar tu contraseña o tu nombre de usuario.</p>
      </div>

      <form id="account-recovery-form" class="recovery-form">
        <div class="field">
          <label for="recovery-email">Correo electrónico</label>
          <input id="recovery-email" name="correo" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="recovery-actions">
          <button class="login-button" id="recover-password" type="button">Recuperar contraseña</button>
          <button class="secondary-button" id="recover-username" type="button">Recuperar nombre de usuario</button>
        </div>
        <p class="login-status" id="recovery-status" role="status" aria-live="polite"></p>
      </form>

      <form id="reset-password-form" class="recovery-form">
        <div class="field">
          <label for="new-password">Nueva contraseña</label>
          <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        </div>
        <div class="field">
          <label for="confirm-password">Confirmar contraseña</label>
          <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        </div>
        <button class="login-button" type="submit">Cambiar contraseña</button>
        <p class="login-status" id="reset-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="js/recovery.js"></script>
</body>
</html>
